server:
  port: ${VMS_SERVER_PORT:8080}

spring:
  application:
    name: vehicle-monitoring-system
  datasource:
    url: ${VMS_DB_URL:jdbc:mysql://127.0.0.1:3307/vms?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${VMS_DB_USERNAME:vms}
    password: ${VMS_DB_PASSWORD:}
  task:
    scheduling:
      pool:
        size: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${VMS_REDIS_HOST:127.0.0.1}
      port: ${VMS_REDIS_PORT:6380}
      connect-timeout: 1s
      timeout: 1s

sa-token:
  token-name: satoken
  # 8 小时绝对到期，不随活跃续期
  timeout: 28800
  active-timeout: -1
  auto-renew: false
  is-share: false
  # 单账号单有效会话：后登录挤掉旧会话（旧会话收到 SESSION_REPLACED）
  is-concurrent: false
  # 会话凭证只通过请求头传递，不写入 Cookie、请求体或 URL
  is-read-cookie: false
  is-read-body: false
  is-read-header: true
  is-lasting-cookie: false
  is-print: false
  alone-redis:
    database: 0
    host: ${spring.data.redis.host}
    port: ${spring.data.redis.port}
    timeout: 5s

vms:
  bootstrap-admin:
    username: ${VMS_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${VMS_BOOTSTRAP_ADMIN_PASSWORD:}
  login:
    # 连续失败 5 次锁定 10 分钟；登录成功重置计数
    max-failures: 5
    lock-minutes: 10
    # 来源速率限制（工程补充，避免凭证猜测与锁定滥用）
    rate-limit-max-attempts: 20
    rate-limit-window-seconds: 60
